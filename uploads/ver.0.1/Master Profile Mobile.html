<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Master Profile — Mobile Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ECE7DC; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* hide scrollbars inside device */
  .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }

  /* 숏폼 썸네일 호버 — 이미지 살짝 확대 */
  .shorts-cell .shorts-img {
    transform: scale(1);
  }
  .shorts-cell:hover .shorts-img {
    transform: scale(1.08);
  }
  .shorts-cell:active .shorts-img {
    transform: scale(1.04);
    transition-duration: 0.18s;
  }

  /* PC 카드 호버 미리보기 영상 페이드 인 */
  @keyframes previewFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  /* PREVIEW 라이브 도트 펄스 */
  @keyframes pulseDot {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.7); }
  }

  /* 챗 플로팅 — 메시지 펑 등장 (스케일 + 페이드) */
  @keyframes chatPopIn {
    0%   { opacity: 0; transform: translateY(14px) scale(0.85); }
    60%  { opacity: 1; transform: translateY(-3px) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 백조 idle — 3초 주기 가벼운 부유감 */
  @keyframes swanIdle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1.5deg); }
  }

  /* 알림 도트 펄스 링 */
  @keyframes notifPulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* 챗 패널 슬라이드 인 (우측에서) */
  @keyframes chatPanelIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* 알림 드롭다운 슬라이드 다운 */
  @keyframes notifSlideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 애터미소개 페이지 슬라이드 인 */
  @keyframes aboutSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* 인생시나리오 항목 패널 — 우측에서 슬라이드 인 */
  @keyframes goalSlideLeft {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
  }
  /* 음성 챗 — 파형 막대 들썩임 */
  @keyframes voiceBar {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
  /* 제품 히어로 — 보틀 부유 */
  @keyframes heroFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-8px) rotate(-1deg); }
  }

  /* 숏폼 카드 stagger fade-in */
  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* 좋아요 하트 폭발 파티클 */
  @keyframes heartBurst {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(var(--rot, 0deg)); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, -60px)) scale(1.3) rotate(var(--rot, 0deg)); }
  }
  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.45); }
    70%      { transform: scale(0.95); }
  }


  /* 영상 위 떠다니는 제품 광고 — 부드러운 부유 (좌우 + 상하 + 살짝 회전) */
  @keyframes adFloat {
    0%   { transform: translateY(0)   translateX(0)  rotate(-3deg); }
    25%  { transform: translateY(-10px) translateX(-4px) rotate(2deg); }
    50%  { transform: translateY(-4px)  translateX(2px)  rotate(-2deg); }
    75%  { transform: translateY(-12px) translateX(-2px) rotate(3deg); }
    100% { transform: translateY(0)   translateX(0)  rotate(-3deg); }
  }
  /* 광고 등장 — 우측에서 살짝 미끄러져 들어오며 페이드 인 */
  @keyframes adSlideIn {
    from { opacity: 0; transform: translateX(40px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  /* 라벨 칩 펄스 — '이 제품이 궁금하시다면?' 미세 글로우 */
  @keyframes adLabelPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(0,182,240,0.35); }
    50%      { box-shadow: 0 4px 22px rgba(0,182,240,0.6); }
  }

  /* 챗 플로팅 — 백조 캐릭터의 흰 배경을 화면에 자연스럽게 녹이기 위한 부모 클래스 */
  .chat-swan-host {
    isolation: isolate;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="android_frame.jsx"></script>
<script type="text/babel" src="browser_window.jsx"></script>
<script type="text/babel" src="components/Icons.jsx"></script>
<script type="text/babel" src="components/AtomyLogo.jsx"></script>
<script type="text/babel" src="components/Data.jsx"></script>
<script type="text/babel" src="components/ShortsThumbnail.jsx"></script>
<script type="text/babel" src="components/ChatFloating.jsx"></script>
<script type="text/babel" src="components/NotificationPopup.jsx"></script>
<script type="text/babel" src="components/LanguageSwitcher.jsx"></script>
<script type="text/babel" src="components/VariationClassic.jsx"></script>
<script type="text/babel" src="components/VariationDesktop.jsx"></script>
<script type="text/babel" src="components/AtomyAbout.jsx"></script>
<script type="text/babel" src="components/AtomyLife.jsx"></script>
<script type="text/babel" src="components/AtomyShop.jsx"></script>
<script type="text/babel" src="components/AtomyProductDetail.jsx"></script>

<script type="text/babel">
const canvasBg = '#ECE7DC';

function App() {
  return (
    <div style={{
      minHeight: '100vh', background: canvasBg, padding: '44px 32px 60px',
    }}>
      {/* Header */}
      <div style={{ textAlign: 'center', marginBottom: 40 }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 10,
          padding: '6px 14px', borderRadius: 999,
          background: '#0B1F3A', color: '#5CD3F7',
          fontSize: 10, letterSpacing: '0.24em', fontWeight: 800,
        }}>
          <span style={{ width: 6, height: 6, background: '#00B6F0', transform: 'rotate(45deg)' }} />
          ATOMY · MASTER PROFILE
          <span style={{ width: 6, height: 6, background: '#00B6F0', transform: 'rotate(45deg)' }} />
        </div>
        <h1 style={{
          margin: '14px 0 8px', fontSize: 34, fontWeight: 800,
          letterSpacing: '-0.025em', color: '#0B1F3A',
        }}>
          석세스클립 · 원페이지
        </h1>
        <p style={{
          margin: '0 auto', maxWidth: 680, fontSize: 14, lineHeight: 1.65, color: '#4A5568',
          textWrap: 'pretty',
        }}>
          좌우 화살표로 넘기는 프로필 캐러셀(이미지 · 영상 혼합) · 직급 뱃지와 SNS 4채널 · 50개 석세스클립 피드 ·
          탭 시 전체화면 플레이어(스와이프 · 휠 스크롤 · 핀치 줌 · 실제 영상 재생)까지.
          애터미 네이비 & 시안 블루 톤으로 정리했습니다.
        </p>
      </div>

      {/* Devices — Mobile + Desktop 나란히 배치 */}
      <div style={{
        display: 'flex', gap: 60, alignItems: 'flex-start', justifyContent: 'center',
        flexWrap: 'wrap',
      }}>
        {/* Mobile */}
        <div data-screen-label="01 Mobile" style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18,
        }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{
              fontSize: 11, letterSpacing: '0.22em', color: '#2A8AB0', fontWeight: 800,
            }}>MOBILE · ANDROID 393×852</div>
            <div style={{
              fontSize: 12.5, color: '#5A6373', marginTop: 8, maxWidth: 360,
            }}>네이비 + 시안 블루 · 20 미디어 & 50 클립 · 풀스크린 플레이어</div>
          </div>

          <AndroidDevice dark={false} width={393} height={852}>
            <div style={{
              flex: 1, position: 'relative', overflow: 'hidden',
              display: 'flex', flexDirection: 'column',
            }}>
              <div className="phone-scroll" style={{
                flex: 1, overflowY: 'auto', overflowX: 'hidden',
              }}>
                <VariationClassic />
              </div>
              {/* 스크롤 따라다니는 플로팅 — 스크롤 컨테이너의 형제 */}
              <ChatFloating size="mobile" />
            </div>
          </AndroidDevice>
        </div>

        {/* Desktop */}
        <div data-screen-label="02 Desktop" style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18,
        }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{
              fontSize: 11, letterSpacing: '0.22em', color: '#2A8AB0', fontWeight: 800,
            }}>DESKTOP · 1280px</div>
            <div style={{
              fontSize: 12.5, color: '#5A6373', marginTop: 8, maxWidth: 360,
            }}>글로벌 헤더 · 좌측 프로필 카드 · 우측 5열 클립 그리드</div>
          </div>

          <BrowserWindow
            url="https://atomy.com/master/mimikim"
            title="몽상 박한길 · 대한민국 가장 존경받는 CEO — ATOMY"
            width={1280}
            height={820}
          >
            <div style={{
              width: '100%', height: '100%',
              position: 'relative', overflow: 'hidden',
            }}>
              <div className="phone-scroll" style={{
                width: '100%', height: '100%',
                overflowY: 'auto', overflowX: 'hidden',
              }}>
                <VariationDesktop />
              </div>
              {/* 스크롤 따라다니는 플로팅 */}
              <ChatFloating size="desktop" />
            </div>
          </BrowserWindow>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
