<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>ATOMY · iPhone 17 미리보기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Sans:wght@300;400;500;600;700;800;900&display=swap">
<style>
  html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; }
  /* dvh (dynamic viewport height) — iOS Safari 주소창 높이 반영 */
  #root { height: 100dvh; }
  * { box-sizing: border-box; }
  body {
    /* iPhone 17은 Noto Sans 적용 */
    font-family: 'Noto Sans KR', 'Noto Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #F7F5F0;
    overscroll-behavior: none;
    overflow: hidden;
  }
  /* hide scrollbars inside device */
  .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .drag-scroll-x { scrollbar-width: none; -ms-overflow-style: none; cursor: grab; scroll-behavior: auto; }
  .drag-scroll-x::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .drag-scroll-x.is-dragging { cursor: grabbing; scroll-snap-type: none !important; }
  .drag-scroll-x.is-dragging * { pointer-events: none; }

  /* 영상 재생 중 — 우측 하단 애터미 어시스턴트(채팅 플로팅) 숨김 */
  body.in-video-playback .chat-floating-host { display: none !important; }

  /* 숏폼 썸네일 호버 — 이미지 살짝 확대 */
  .shorts-cell .shorts-img { transform: scale(1); }
  .shorts-cell:hover .shorts-img { transform: scale(1.08); }
  .shorts-cell:active .shorts-img { transform: scale(1.04); transition-duration: 0.18s; }

  /* PC 카드 호버 미리보기 영상 페이드 인 */
  @keyframes previewFadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* PREVIEW 라이브 도트 펄스 */
  @keyframes pulseDot {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.7); }
  }
  /* 챗 플로팅 — 메시지 펑 등장 */
  @keyframes chatPopIn {
    0%   { opacity: 0; transform: translateY(14px) scale(0.85); }
    60%  { opacity: 1; transform: translateY(-3px) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* 백조 idle */
  @keyframes swanIdle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1.5deg); }
  }
  /* 알림 도트 펄스 링 */
  @keyframes notifPulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  /* 챗 패널 슬라이드 인 */
  @keyframes chatPanelIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  /* 알림 드롭다운 슬라이드 다운 */
  @keyframes notifSlideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes aboutSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes goalSlideLeft {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
  }
  @keyframes voiceBar {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
  @keyframes heroFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-8px) rotate(-1deg); }
  }
  @keyframes heroSlideIn {
    from { opacity: 0; transform: translateX(20px) scale(0.96); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes heartBurst {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(var(--rot, 0deg)); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, -60px)) scale(1.3) rotate(var(--rot, 0deg)); }
  }
  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.45); }
    70%      { transform: scale(0.95); }
  }
  @keyframes adFloat {
    0%   { transform: translateY(0)   translateX(0)  rotate(-3deg); }
    25%  { transform: translateY(-10px) translateX(-4px) rotate(2deg); }
    50%  { transform: translateY(-4px)  translateX(2px)  rotate(-2deg); }
    75%  { transform: translateY(-12px) translateX(-2px) rotate(3deg); }
    100% { transform: translateY(0)   translateX(0)  rotate(-3deg); }
  }
  @keyframes adSlideIn {
    from { opacity: 0; transform: translateX(40px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes adLabelPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(0,182,240,0.35); }
    50%      { box-shadow: 0 4px 22px rgba(0,182,240,0.6); }
  }
  .chat-swan-host { isolation: isolate; }

  /* 영상 풀스크린 재생 중에만 어시스턴트 플로팅 숨김 */
  body.in-video-playback .chat-floating-host { display: none !important; }
  body.in-product-detail .chat-floating-host {
    bottom: 128px !important;
    z-index: 9999 !important;
  }
  body.in-ios-video-detail .chat-floating-host {
    z-index: 10001 !important;
  }

  /* CTA 펄스 링 */
  @keyframes ctaPulseRing {
    0%   { transform: scale(1);    opacity: 0.55; }
    70%  { transform: scale(1.18); opacity: 0; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  .cta-pulse { position: relative; isolation: isolate; }
  .cta-pulse::before, .cta-pulse::after {
    content: ''; position: absolute; inset: 0;
    border-radius: inherit; pointer-events: none; z-index: -1;
    box-shadow: 0 0 0 2px var(--cta-pulse-color, rgba(0,182,240,0.55));
    animation: ctaPulseRing 2s ease-out infinite;
  }
  .cta-pulse::after { animation-delay: 1s; }

  /* fly-to-cart */
  @keyframes cartBounce {
    0%, 100% { transform: scale(1); }
    35%      { transform: scale(1.35); }
    65%      { transform: scale(0.92); }
  }
  .cart-bounce { animation: cartBounce 0.55s cubic-bezier(.2,.7,.3,1.4); }
  @keyframes cartPing {
    0%   { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes badgeShine {
    0%   { transform: translateX(-120%) skewX(-20deg); }
    60%  { transform: translateX(220%)  skewX(-20deg); }
    100% { transform: translateX(220%)  skewX(-20deg); }
  }
  .chairman-badge { position: relative; overflow: hidden; isolation: isolate; }
  .chairman-badge::after {
    content: ''; position: absolute;
    top: -2px; bottom: -2px; left: 0; width: 35%;
    background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%, rgba(255,235,170,0.55) 35%,
      rgba(255,255,255,0.95) 50%, rgba(255,235,170,0.55) 65%,
      rgba(255,255,255,0) 100%);
    transform: translateX(-120%) skewX(-20deg);
    animation: badgeShine 2.6s ease-in-out infinite;
    animation-delay: 1.2s;
    pointer-events: none; mix-blend-mode: overlay;
  }
  @keyframes bellWobble {
    0%, 60%, 100% { transform: rotate(0deg); }
    62% { transform: rotate(14deg); } 65% { transform: rotate(-12deg); }
    68% { transform: rotate(10deg); } 71% { transform: rotate(-8deg); }
    74% { transform: rotate(5deg); }  77% { transform: rotate(-3deg); } 80% { transform: rotate(0deg); }
  }
  .bell-wobble { transform-origin: 50% 18%; animation: bellWobble 6s ease-in-out infinite; }
  @keyframes bigHeartPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-12deg); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(-12deg); }
    60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(-12deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4)  rotate(-12deg); }
  }
  @keyframes confettiFall {
    0%   { opacity: 0; transform: translate(0,0) rotate(0deg); }
    8%   { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--cdx, 0px), var(--cdy, 200px)) rotate(var(--crot, 720deg)); }
  }
  @keyframes proofIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes proofOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-20px); }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="/components/Icons.jsx"></script>
<script type="text/babel" src="/components/AtomyLogo.jsx"></script>
<script type="text/babel" src="/components/i18n.jsx"></script>
<script type="text/babel" src="/components/Data.jsx"></script>
<script type="text/babel" src="/components/ShortsThumbnail.jsx"></script>
<script type="text/babel" src="/components/ChatFloating.jsx"></script>
<script type="text/babel" src="/components/NotificationPopup.jsx"></script>
<script type="text/babel" src="/components/LanguageSwitcher.jsx"></script>
<script type="text/babel" src="/components/AtomyShopVariants.jsx"></script>
<script type="text/babel" src="/components/VariationClassic.jsx"></script>
<script type="text/babel" src="/components/AtomyAbout.jsx"></script>
<script type="text/babel" src="/components/AtomyLife.jsx"></script>
<script type="text/babel" src="/components/AtomyShop.jsx"></script>
<script type="text/babel" src="/components/AtomyProductDetailVariants.jsx"></script>
<script type="text/babel" src="/components/AtomyProductDetail.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  return (
    <div style={{
      width: '100%', height: '100%',
      position: 'relative', overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
      background: '#F7F5F0',
    }}>
      <div className="phone-scroll" style={{
        flex: 1, overflowY: 'auto', overflowX: 'hidden',
        position: 'relative', minWidth: 0,
      }}>
        <VariationClassic shopVariant="default" deviceVariant="ios" />
      </div>
      <ChatFloating size="mobile" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
